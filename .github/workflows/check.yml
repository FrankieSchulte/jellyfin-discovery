name: Check discovery
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm run check
      - run: npm test
      - run: git diff --exit-code -- dist/fazfort-discovery.js
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build native/src -c Release --nologo
      - run: dotnet run --project native/tests -c Release

      - run: dotnet run --project native/shelf-tests -c Release

      - run: python3 -m unittest discover -s tests -p 'test_*.py'
      - run: python3 scripts/catalog.py
