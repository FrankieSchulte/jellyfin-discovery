<!DOCTYPE html><html><head><title>Request Hub</title></head><body><div id="requestHubConfig" data-role="page" class="page type-interior pluginConfigurationPage"><div data-role="content"><div class="content-primary"><h2>Request Hub</h2><p>Connect a Jellyseerr server. Each Jellyfin user must be explicitly mapped to their own Jellyseerr user ID. Jellyseerr enforces that account's permissions, quotas and approval rules. Never map regular users to an administrator account.</p><form id="rhConfigForm"><label><input type="checkbox" id="rhEnabled"> Enable connection</label><div class="inputContainer"><label>Server URL<input is="emby-input" id="rhUrl" placeholder="http://jellyseerr:5055"></label></div><div class="inputContainer"><label>API key (stored on this server)<input is="emby-input" id="rhKey" type="password" autocomplete="new-password"></label></div><h3>User mappings</h3><div id="rhMappings"></div><button type="button" is="emby-button" id="rhAdd">Add user mapping</button><button is="emby-button" type="submit">Save</button><p id="rhConfigStatus" role="status"></p></form></div></div><script>
(function(){'use strict';var id='56cd1277-c4de-4f5c-93f6-080398c7432e',page=document.querySelector('#requestHubConfig'),config;
function get(id){return page.querySelector('#'+id);}function row(user){var div=document.createElement('div');div.className='inputContainer';[['Jellyfin user ID',user.JellyfinUserId||'', 'text'],['Jellyseerr user ID',user.SeerrUserId||'', 'number']].forEach(function(field){var label=document.createElement('label'),input=document.createElement('input');label.textContent=field[0];input.value=field[1];input.type=field[2];input.required=true;label.appendChild(input);div.appendChild(label);});var label=document.createElement('label'),check=document.createElement('input');check.type='checkbox';check.checked=!!user.AllowRequests;label.appendChild(check);label.appendChild(document.createTextNode(' Allow requests'));div.appendChild(label);var remove=document.createElement('button');remove.type='button';remove.textContent='Remove';remove.onclick=function(){div.remove();};div.appendChild(remove);get('rhMappings').appendChild(div);}
page.addEventListener('pageshow',function(){ApiClient.getPluginConfiguration(id).then(function(c){config=c;get('rhEnabled').checked=c.Enabled;get('rhUrl').value=c.ServerUrl;get('rhKey').value=c.ApiKey;get('rhMappings').textContent='';(c.Users||[]).forEach(row);}).catch(function(){get('rhConfigStatus').textContent='Administrator access is required to load these settings.';});});get('rhAdd').onclick=function(){row({});};get('rhConfigForm').onsubmit=function(e){e.preventDefault();if(!config)return;config.Enabled=get('rhEnabled').checked;config.ServerUrl=get('rhUrl').value.trim();config.ApiKey=get('rhKey').value;config.Users=Array.from(get('rhMappings').children).map(function(div){var inputs=div.querySelectorAll('input');return{JellyfinUserId:inputs[0].value.trim(),SeerrUserId:Number(inputs[1].value),AllowRequests:inputs[2].checked};});ApiClient.updatePluginConfiguration(id,config).then(function(){get('rhConfigStatus').textContent='Saved. Open Discover to test your mapped account.';}).catch(function(){get('rhConfigStatus').textContent='Save failed. Check the server URL, unique Jellyfin IDs and positive Jellyseerr IDs.';});};})();
</script></div></body></html>
