name: Release plugin catalog
on:
  workflow_dispatch:
  push:
    tags: ['v*']
concurrency:
  group: discovery-release
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  release:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Validate release version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          tag="v$(node -p "require('./package.json').version")"
          if [[ "$REF_TYPE" == tag && "$REF_NAME" != "$tag" ]]; then
            echo 'Tag does not match package version.' >&2
            exit 1
          fi
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"
          # Never overwrite an existing release or its checksum-addressed assets.
          if gh release view "$tag" >/dev/null 2>&1; then
            echo 'This version already has a release. Bump the version first.' >&2
            exit 1
          fi
      - run: npm ci --ignore-scripts
      - run: npm run build && npm run check && npm test
      - run: git diff --exit-code -- dist/fazfort-discovery.js requests/dist/web.js
      - run: dotnet build native/src -c Release --nologo
      - run: dotnet run --project native/tests -c Release
      - run: dotnet run --project native/shelf-tests -c Release
      - run: dotnet build requests/src -c Release --nologo
      - run: dotnet run --project requests/tests -c Release
      - run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Package catalog assets
        run: python3 scripts/catalog.py --timestamp "$(git show -s --format=%cI HEAD)"
      - uses: actions/upload-artifact@v4
        with:
          name: jellyfin-plugin-catalog
          path: release/catalog/*
      - name: Publish tested release
        run: |
          gh release create "$RELEASE_TAG" release/catalog/* \
            --target "$GITHUB_SHA" --title "Jellyfin Discovery $RELEASE_TAG" \
            --notes-file docs/RELEASE_NOTES.md --latest
