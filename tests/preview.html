<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FazFort Discovery — local fixture</title>
<style>body{margin:0;background:#101010;color:white;font-family:Arial,sans-serif}.hide{display:none}nav{position:sticky;top:0;z-index:10;background:#181818;padding:20px}nav a{color:white;margin:0 15px}.fixture-hero{padding:70px 5vw;background:linear-gradient(100deg,#132a39,#403936)}.native-fixture{padding:40px;border:1px dashed #555}button{cursor:pointer}</style>
<nav><a href="#/home">Home</a><a href="#/movies?topParentId=movies">Movies</a><a href="#/tv?topParentId=shows">Shows</a></nav>
<div id="indexPage" class="page"><div class="fixture-hero"><h1>Discovery preview</h1><p>Synthetic catalogue for testing. No connection to your Jellyfin server.</p></div><div class="homeSectionsContainer native-fixture">Original Home — visible whenever Discovery is disabled or fails.</div></div>
<div id="moviesPage" class="page hide"><div class="pageTabContent native-fixture" data-index="0">Original movie list — filters and sorting remain here.</div></div>
<div id="tvshowsPage" class="page hide"><div class="pageTabContent native-fixture" data-index="0">Original show list — filters and sorting remain here.</div></div>
<script>
const id=n=>n.toString(16).padStart(32,'0');
const themes=['space','coming of age','based on video game','superhero','magic','anime'];
const catalogue=Array.from({length:90},(_,n)=>({Id:id(n+1),Name:['Beyond the Stars','A Summer Story','New Worlds','The Long Way Home','Midnight City','Another Adventure'][n%6]+' '+(1+Math.floor(n/6)),Type:n%3?'Movie':'Series',Genres:[['Science Fiction','Adventure'],['Drama','Comedy'],['Action','Fantasy']][n%3],Tags:[themes[n%6]],CommunityRating:7+n%3,ProductionYear:1980+n%45,RunTimeTicks:90*600000000,DateCreated:n%4?new Date().toISOString():'2020-01-01',BackdropImageTags:['test'],ImageTags:{Primary:'test'},People:[{Name:'Director '+n%5,Type:'Director'},{Name:'Actor '+n%7,Type:'Actor'}],Studios:[{Name:'Example Studio'}],UserData:{Played:n%8===0}}));
window.ApiClient={getCurrentUserId:()=> 'preview',serverId:()=> 'fixture',getUrl:(p,q)=>({p,q}),getImageUrl:i=>location.origin+'/art.svg?id='+encodeURIComponent(i),getJSON:async({p})=>{await new Promise(r=>setTimeout(r,80));if(p.endsWith('/Views'))return {Items:[{Id:'movies',Name:'Movies',CollectionType:'movies'},{Id:'shows',Name:'Shows',CollectionType:'tvshows'}]};return {Items:catalogue.slice(3,11)};},getItems:async(u,p)=>{await new Promise(r=>setTimeout(r,60));if(p.Ids)return {Items:catalogue.filter(i=>p.Ids.split(',').includes(i.Id))};if(p.IncludeItemTypes==='Season')return {Items:[{Id:'season',Type:'Season',SeriesId:id(1),IndexNumber:2,DateCreated:new Date().toISOString()}]};return {Items:catalogue.filter(i=>p.IncludeItemTypes.split(',').includes(i.Type))};}};
function route(){const path=location.hash.split('?')[0];document.querySelectorAll('.page').forEach(p=>p.classList.add('hide'));document.getElementById(path==='#/movies'?'moviesPage':path==='#/tv'?'tvshowsPage':'indexPage').classList.remove('hide');}
if(!location.hash)location.hash='#/home';addEventListener('hashchange',route);route();
</script><script src="/dist/fazfort-discovery.js"></script></html>
